# Security updates only: 0 disables routine version PRs, not security PRs.
# Alerts/security updates are enabled separately in repository settings.
# Docker manifest coverage is retained; this is not a container CVE scanner.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directories:
      - /deploy/sbn-solr
      - /registry-mgr-legacy/src/main/resources/build
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /src/main/resources
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
