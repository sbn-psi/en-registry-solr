version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      maven-patch-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
  - package-ecosystem: docker
    directories:
      - /deploy/sbn-solr
      - /registry-mgr-legacy/src/main/resources/build
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-patch-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
  - package-ecosystem: pip
    directory: /src/main/resources
    schedule:
      interval: weekly
      day: monday
    groups:
      python-patch-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
